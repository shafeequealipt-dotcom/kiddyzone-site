name: Build & deploy

# Runs on every push (the blog agent's posts included), daily as a safety net, and
# from the "Run workflow" button.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A post with bad frontmatter fails here, so it never reaches the server.
      - name: Build site and sitemap
        run: npm run build

      - name: Verify sitemap was generated
        run: |
          test -s dist/sitemap.xml || { echo "::error::sitemap.xml missing or empty"; exit 1; }
          echo "URLs in sitemap: $(grep -c '<loc>' dist/sitemap.xml)"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy

# Required repository secrets: SSH_PRIVATE_KEY, SSH_HOST, SSH_USER, DEPLOY_PATH.
