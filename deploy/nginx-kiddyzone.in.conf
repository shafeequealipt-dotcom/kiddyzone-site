# nginx site for kiddyzone.in on the Oracle VM, installed as
# /etc/nginx/sites-available/kiddyzone.in. Certificates from certbot (auto-renewing).

# www and plain HTTP go to https://kiddyzone.in, the one canonical host.
server {
    listen 80;
    listen [::]:80;
    server_name kiddyzone.in www.kiddyzone.in;
    return 301 https://kiddyzone.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kiddyzone.in;
    ssl_certificate /etc/letsencrypt/live/kiddyzone.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiddyzone.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://kiddyzone.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kiddyzone.in;
    ssl_certificate /etc/letsencrypt/live/kiddyzone.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiddyzone.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kiddyzone;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    error_page 404 /404.html;

    location / {
        # Serve /toys from toys/index.html directly; canonical URLs have no trailing slash.
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Astro's hashed assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
